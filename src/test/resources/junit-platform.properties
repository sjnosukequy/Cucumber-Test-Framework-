cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=short
cucumber.junit-platform.naming-strategy.long.example-name=pickle
cucumber.junit-platform.naming-strategy.surefire.example-name=pickle
cucumber.junit-platform.naming-strategy.short.example-name=pickle
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm,org.example.cucumber.plugins.CucumberSummaryPlugin
cucumber.glue=org.example.cucumber.tests
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4